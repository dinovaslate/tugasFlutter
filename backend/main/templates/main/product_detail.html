<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        main {
            max-width: 720px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 0.75rem;
            padding: 1.5rem 1.75rem 1.75rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .meta {
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .thumbnail {
            margin: 1rem 0;
        }

        .thumbnail img {
            max-width: 100%;
            border-radius: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
        }

        button {
            padding: 0.45rem 0.9rem;
            border-radius: 0.35rem;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            background: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body>
<main>
    <button type="button" onclick="history.back()">← Back</button>
    <h1>{{ product.name }}</h1>
    <div class="meta">
        <span class="badge">{{ product.get_category_display }}</span>
        &nbsp; • &nbsp;
        Owner: {{ product.owner.username }}
        &nbsp; • &nbsp;
        Price: {{ product.price }}
        {% if product.is_featured %}&nbsp; • &nbsp; Featured{% endif %}
    </div>
    <div class="thumbnail">
        <img src="{{ product.thumbnail }}" alt="Thumbnail for {{ product.name }}">
    </div>
    <p>{{ product.description }}</p>
</main>
</body>
</html>
