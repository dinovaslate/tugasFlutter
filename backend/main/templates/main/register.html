<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.1);
            padding: 1.5rem 2rem 2rem;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
        }

        input {
            margin-top: 0.25rem;
            padding: 0.45rem 0.55rem;
            border-radius: 0.35rem;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }

        button {
            padding: 0.45rem 0.8rem;
            border-radius: 0.35rem;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-primary {
            background: #0d6efd;
            color: #fff;
        }

        .text-muted {
            color: #6b7280;
            font-size: 0.8rem;
        }

        #status {
            margin-top: 0.75rem;
            font-size: 0.85rem;
        }

        #status.success {
            color: #16a34a;
        }

        #status.error {
            color: #dc2626;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Register</h1>
    <p class="text-muted">Create a new account. After successful registration, you can log in from the login page.</p>

    <form id="register-form">
        <label>
            Username
            <input name="username" required>
        </label>
        <label>
            Password
            <input type="password" name="password1" required>
        </label>
        <label>
            Confirm Password
            <input type="password" name="password2" required>
        </label>
        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="text-muted" style="margin-top: 1rem;">
        Already have an account?
        <a href="/">Login here</a>.
    </p>

    <div id="status"></div>
</div>

<script>
    const statusEl = document.getElementById('status');

    function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = type ? type : '';
    }

    async function api(path, options = {}) {
        const settings = {
            method: options.method || 'GET',
            headers: {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            },
            credentials: 'include'
        };
        if (options.body !== undefined) {
            settings.body = JSON.stringify(options.body);
        }
        const response = await fetch(path, settings);
        let data = null;
        const ct = response.headers.get('Content-Type') || '';
        if (ct.includes('application/json')) {
            data = await response.json();
        } else {
            data = await response.text();
        }
        if (!response.ok) {
            throw {response, data};
        }
        return data;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        setStatus('Registering...', '');
        const form = e.target;
        const payload = {
            username: form.username.value,
            password1: form.password1.value,
            password2: form.password2.value
        };
        try {
            const data = await api('/auth/register/', {method: 'POST', body: payload});
            setStatus(data.message || 'Registered successfully. You can now log in.', 'success');
        } catch (err) {
            let message = 'Registration failed.';
            if (err.data) {
                if (err.data.errors) {
                    const parts = [];
                    for (const [field, msgs] of Object.entries(err.data.errors)) {
                        parts.push(`${field}: ${Array.isArray(msgs) ? msgs.join(', ') : msgs}`);
                    }
                    message = parts.join(' | ');
                } else if (err.data.message) {
                    message = err.data.message;
                } else {
                    message = JSON.stringify(err.data);
                }
            }
            setStatus(message, 'error');
        }
    });
</script>
</body>
</html>
